[package]
name = "mnist"
version = "0.1.0"
edition = "2021"
authors = ["Adrien Pelfresne", "Alexis Vapaille"]

[dependencies]
byteorder = "1.5.0"
clap = "4.5.4"
flate2 = "1.0.30"
log = "0.4.21"
# Keep ndarray for initial data loading from IDX files
ndarray = {version = "0.15.6"}
# ndarray-rand = "0.14.0"
pretty_env_logger = "0.5.0"
anyhow = "1.0.83"
nn_lib = {path = "../nn_lib/"}
rand = "0.8.5"
image = "0.25.1"
imageproc = "0.25.0"
# Add Candle for tensor operations
candle-core = { version = "0.9.1", features = ["cuda"] }
